name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: "./package.json"

      # changesets/action v2 no longer writes an .npmrc from NPM_TOKEN. Changesets
      # shells out to `npm publish`, so npm needs the registry auth set up here.
      - name: Setup npm authentication
        uses: actions/setup-node@v7.0.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: bun i

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          version-script: bun changeset version
          publish-script: bun changeset publish
          create-github-releases: true

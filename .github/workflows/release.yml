name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: "./package.json"

      # Changesets shells out to `npm publish`, so the npm on PATH is what talks to
      # the registry. Trusted publishing (OIDC) needs npm >= 11.5.1 and Node >= 22.14.
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Node 24 does not consistently bundle npm >= 11.5.1, so pin it explicitly.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: bun i

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.0
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          version-script: bun changeset version
          publish-script: bun changeset publish
          create-github-releases: true
